# Reverse proxy for AgentCtrl on an Oracle Cloud VPS
# Place at /etc/nginx/sites-available/agentctrl and symlink into sites-enabled.

server {
    listen 80;
    server_name your-domain.example.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# After confirming this works, run:
#   sudo certbot --nginx -d your-domain.example.com
# to get a free TLS cert and auto-upgrade this block to listen 443 ssl.
