version: "3.9"

services:
  agentctrl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentctrl-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      # - AGENTCTRL_ADAPTER=redis          # flip to "redis" once real bridges (or the demo harnesses below) are publishing
      # - AGENTCTRL_PASSWORD=change-me     # enable the password gate (see .env.example)
      # - AGENTCTRL_AGENT_TOKEN=change-me  # shared secret for agent-written journal entries
      # - OBSIDIAN_VAULT_REPO=https://github.com/you/your-vault-repo.git
      # - OBSIDIAN_VAULT_TOKEN=github_pat_xxx   # fine-grained PAT, Contents read/write, scoped to the vault repo only
    volumes:
      - vault-data:/app/vault
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agentctrl-net

  redis:
    image: redis:7-alpine
    container_name: agentctrl-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - agentctrl-net

  # --- Demo bridge harnesses -------------------------------------------------
  # Reference implementations of harnesses/example-agent-harness. Off by
  # default (profile "demo"). Start them alongside the dashboard with:
  #   docker compose --profile demo up -d
  # then set AGENTCTRL_ADAPTER=redis above and restart the agentctrl service
  # to see the Overview/agent pages, /diagnostics, and Chat replies reading
  # real Redis data.
  hermes-bridge:
    build: ./harnesses/example-agent-harness
    container_name: agentctrl-hermes-bridge
    restart: unless-stopped
    profiles: ["demo"]
    environment:
      - REDIS_URL=redis://redis:6379
      - AGENT_ID=hermes
      - AGENT_NAME=Hermes
      - AGENT_TAGLINE=Messenger & orchestration agent
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agentctrl-net

  codex-bridge:
    build: ./harnesses/example-agent-harness
    container_name: agentctrl-codex-bridge
    restart: unless-stopped
    profiles: ["demo"]
    environment:
      - REDIS_URL=redis://redis:6379
      - AGENT_ID=codex
      - AGENT_NAME=Codex
      - AGENT_TAGLINE=Autonomous coding agent
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agentctrl-net

  openclaw-bridge:
    build: ./harnesses/example-agent-harness
    container_name: agentctrl-openclaw-bridge
    restart: unless-stopped
    profiles: ["demo"]
    environment:
      - REDIS_URL=redis://redis:6379
      - AGENT_ID=openclaw
      - AGENT_NAME=OpenClaw
      - AGENT_TAGLINE=Task execution & tooling agent
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agentctrl-net
  # ---------------------------------------------------------------------------

networks:
  agentctrl-net:
    driver: bridge

volumes:
  redis-data:
  vault-data:
