version: "3.9"

services:
  agentctrl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentctrl-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      # - AGENTCTRL_ADAPTER=redis          # flip to "redis" once real bridges (or the demo harnesses below) are publishing
      # - AGENTCTRL_PASSWORD=change-me     # enable the password gate (see .env.example)
      # - AGENTCTRL_AGENT_TOKEN=change-me  # shared secret for agent-written journal entries
      # - OBSIDIAN_VAULT_REPO=https://github.com/you/your-vault-repo.git
      # - OBSIDIAN_VAULT_TOKEN=github_pat_xxx   # fine-grained PAT, Contents read/write, scoped to the vault repo only
    volumes:
      - vault-data:/app/vault
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agentctrl-net

  redis:
    image: redis:7-alpine
    container_name: agentctrl-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - agentctrl-net

  # --- Real bridges -----------------------------------------------------------
  # hermes-bridge talks to an ACTUAL running Hermes Agent via its
  # OpenAI-compatible API server (harnesses/hermes-bridge/README.md). Present
  # by default but self-idles (logs a reminder, does nothing else) until you
  # set HERMES_API_URL + HERMES_API_KEY below — safe to leave as-is until
  # you're ready to wire Hermes in.
  #
  # If Hermes runs as its own separate deployment rather than joining this
  # compose file, point HERMES_API_URL at wherever its port 8642 is actually
  # reachable from this VPS (e.g. http://host.docker.internal:8642 or the
  # host's address) instead of a service name.
  hermes-bridge:
    build: ./harnesses/hermes-bridge
    container_name: agentctrl-hermes-bridge
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379
      # - HERMES_API_URL=http://hermes:8642
      # - HERMES_API_KEY=change-me
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agentctrl-net
  # ---------------------------------------------------------------------------

  # --- Demo bridge harnesses -------------------------------------------------
  # Reference implementations of harnesses/example-agent-harness, entirely
  # synthetic — useful for testing the dashboard with zero real agents wired
  # up. Off by default (profile "demo"). Start them alongside the dashboard
  # with:
  #   docker compose --profile demo up -d
  # then set AGENTCTRL_ADAPTER=redis above and restart the agentctrl service
  # to see the Overview/agent pages, /diagnostics, and Chat replies reading
  # real Redis data. Once hermes-bridge (above) is actually configured, drop
  # hermes-demo-bridge so the two don't both write to agentctrl:agent:hermes:*.
  hermes-demo-bridge:
    build: ./harnesses/example-agent-harness
    container_name: agentctrl-hermes-demo-bridge
    restart: unless-stopped
    profiles: ["demo"]
    environment:
      - REDIS_URL=redis://redis:6379
      - AGENT_ID=hermes
      - AGENT_NAME=Hermes
      - AGENT_TAGLINE=Messenger & orchestration agent
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agentctrl-net

  codex-demo-bridge:
    build: ./harnesses/example-agent-harness
    container_name: agentctrl-codex-demo-bridge
    restart: unless-stopped
    profiles: ["demo"]
    environment:
      - REDIS_URL=redis://redis:6379
      - AGENT_ID=codex
      - AGENT_NAME=Codex
      - AGENT_TAGLINE=Autonomous coding agent
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agentctrl-net

  openclaw-demo-bridge:
    build: ./harnesses/example-agent-harness
    container_name: agentctrl-openclaw-demo-bridge
    restart: unless-stopped
    profiles: ["demo"]
    environment:
      - REDIS_URL=redis://redis:6379
      - AGENT_ID=openclaw
      - AGENT_NAME=OpenClaw
      - AGENT_TAGLINE=Task execution & tooling agent
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agentctrl-net
  # ---------------------------------------------------------------------------

networks:
  agentctrl-net:
    driver: bridge

volumes:
  redis-data:
  vault-data:
